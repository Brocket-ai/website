# Un solo chequeo barato: que no entren secretos al repo. Corre en segundos.
name: Secretos

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Secretos (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1
